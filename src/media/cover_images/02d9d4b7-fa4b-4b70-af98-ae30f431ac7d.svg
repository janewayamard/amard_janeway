<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-label="Uncertainty Analytics — An International Journal cover">
  <title>Uncertainty Analytics — Minimal Animated Cover</title>
  <style>
    .c-pub  { font: 600 7.5px ui-monospace, "SFMono-Regular", Menlo, Consolas, "Courier New", monospace; letter-spacing: .34em; }
    .c-title{ font: 600 26px Georgia, "Times New Roman", serif; letter-spacing: .03em; }
    .c-sub  { font: 500 8px ui-monospace, "SFMono-Regular", Menlo, Consolas, "Courier New", monospace; letter-spacing: .3em; }
    .c-cap  { font: 500 8px ui-monospace, "SFMono-Regular", Menlo, Consolas, "Courier New", monospace; letter-spacing: .22em; }
    .c-vol  { font: 500 9.5px ui-monospace, "SFMono-Regular", Menlo, Consolas, "Courier New", monospace; letter-spacing: .24em; }
    .c-issn { font: 500 7.5px ui-monospace, "SFMono-Regular", Menlo, Consolas, "Courier New", monospace; letter-spacing: .2em; }
    text { text-anchor: middle; }
  </style>

  <defs>
    <linearGradient id="ua-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F1E9"/>
      <stop offset="1" stop-color="#ECE7DB"/>
    </linearGradient>
    <!-- moving sheen for the gold title word -->
    <linearGradient id="ua-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#A9834A"/>
      <stop offset="0.42" stop-color="#B08D4F"/>
      <stop offset="0.50" stop-color="#EFD9A0"/>
      <stop offset="0.58" stop-color="#B08D4F"/>
      <stop offset="1"    stop-color="#A9834A"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.9 0; 0.9 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <!-- gold edge of the dark wave -->
    <linearGradient id="ua-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#9A7432"/>
      <stop offset="0.5" stop-color="#D9BC7A"/>
      <stop offset="1"   stop-color="#9A7432"/>
    </linearGradient>
  </defs>

  <!-- ══════════ paper ══════════ -->
  <rect width="300" height="400" fill="url(#ua-bg)"/>
  <rect x="14" y="14" width="272" height="372" fill="none" stroke="#242E36" stroke-opacity=".22"/>

  <!-- gold corner marks (nod to the print cover) -->
  <path d="M252 30 h14 M266 30 v14" fill="none" stroke="#B08D4F" stroke-width="1.2" stroke-opacity=".9"/>

  <!-- ══════════ masthead ══════════ -->
  <text class="c-pub" x="150" y="42" fill="#242E36" fill-opacity=".55">REA PRESS &#183; ACADEMIC</text>

  <text class="c-title" x="150" y="78" fill="#242E36">UNCERTAINTY</text>
  <text class="c-title" x="150" y="104" fill="url(#ua-shine)">ANALYTICS</text>
  <line x1="116" y1="122" x2="184" y2="122" stroke="#B08D4F" stroke-opacity=".55"/>
  <text class="c-sub" x="150" y="140" fill="#242E36" fill-opacity=".62">AN INTERNATIONAL JOURNAL</text>

  <!-- ══════════ dotted globe + mesh ══════════ -->
  <g fill="none">
    <!-- latitude dot-rings -->
    <circle cx="150" cy="226" r="18" stroke="#242E36" stroke-opacity=".4" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0.1 8"/>
    <circle cx="150" cy="226" r="38" stroke="#B08D4F" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0.1 8">
      <animate attributeName="stroke-opacity" values=".38;.75;.38" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="226" r="58" stroke="#242E36" stroke-opacity=".34" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0.1 8"/>
    <circle cx="150" cy="226" r="76" stroke="#B08D4F" stroke-opacity=".48" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0.1 8"/>

    <!-- great circles (slow dash crawl) -->
    <ellipse cx="150" cy="226" rx="76" ry="26" transform="rotate(-16 150 226)" stroke="#242E36" stroke-opacity=".25" stroke-width="1" stroke-dasharray="3 6">
      <animate attributeName="stroke-dashoffset" values="0;9" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="150" cy="226" rx="26" ry="76" transform="rotate(14 150 226)" stroke="#B08D4F" stroke-opacity=".32" stroke-width="1" stroke-dasharray="3 6">
      <animate attributeName="stroke-dashoffset" values="9;0" dur="20s" repeatCount="indefinite"/>
    </ellipse>

    <!-- orbit ring + travelling satellite -->
    <g>
      <circle cx="150" cy="226" r="90" stroke="#B08D4F" stroke-opacity=".5" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="2 4 0.1 12"/>
      <circle cx="240" cy="226" r="2" fill="#E3C379">
        <animate attributeName="fill-opacity" values="1;.45;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <animateTransform attributeName="transform" type="rotate" from="0 150 226" to="360 150 226" dur="80s" repeatCount="indefinite"/>
    </g>

    <!-- mesh links (whisper-thin lattice) -->
    <g stroke="#242E36" stroke-opacity=".17" stroke-width=".7">
      <line x1="97.5" y1="201.5" x2="202.5" y2="201.5"/>
      <line x1="97.5" y1="201.5" x2="81.1"  y2="258.1"/>
      <line x1="202.5" y1="201.5" x2="218.9" y2="258.1"/>
      <line x1="81.1" y1="258.1" x2="218.9" y2="258.1"/>
      <line x1="150" y1="188" x2="97.5"  y2="201.5"/>
      <line x1="150" y1="188" x2="202.5" y2="201.5"/>
    </g>
  </g>

  <!-- mesh nodes (twinkling) -->
  <circle cx="150" cy="226" r="2.6" fill="#242E36"/>
  <circle cx="150" cy="226" r="1.1" fill="#B08D4F"/>
  <circle cx="150" cy="188" r="1.8" fill="#B08D4F">
    <animate attributeName="fill-opacity" values=".3;1;.3" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="97.5" cy="201.5" r="2" fill="#B08D4F">
    <animate attributeName="fill-opacity" values="1;.3;1" dur="4.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="202.5" cy="201.5" r="2.3" fill="#B08D4F">
    <animate attributeName="fill-opacity" values=".35;1;.35" dur="3.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="81.1" cy="258.1" r="1.6" fill="#242E36" fill-opacity=".5"/>
  <circle cx="218.9" cy="258.1" r="2" fill="#B08D4F">
    <animate attributeName="fill-opacity" values=".4;1;.4" dur="5.2s" repeatCount="indefinite"/>
  </circle>
  <!-- fixed halftone accents on the rings -->
  <circle cx="121" cy="258.8" r="1.1" fill="#242E36" fill-opacity=".4"/>
  <circle cx="181" cy="260.6" r="1.1" fill="#B08D4F" fill-opacity=".55"/>
  <circle cx="226" cy="226" r="1.1" fill="#242E36" fill-opacity=".4"/>
  <circle cx="113" cy="183.9" r="1" fill="#B08D4F" fill-opacity=".5"/>

  <!-- ══════════ dark wave ══════════ -->
  <path d="M0 300 C80 262 170 334 300 296 L300 400 L0 400 Z" fill="#242E36"/>
  <path d="M0 300 C80 262 170 334 300 296" fill="none" stroke="url(#ua-edge)" stroke-width="2.4"/>
  <!-- flowing light along the gold edge -->
  <path d="M0 300 C80 262 170 334 300 296" fill="none" stroke="#F7E7C3" stroke-width="1.7" stroke-linecap="round"
        pathLength="1" stroke-dasharray="0.12 0.88">
    <animate attributeName="stroke-dashoffset" values="1;0" dur="6.5s" repeatCount="indefinite"/>
  </path>
  <!-- dotted echoes in the dark field -->
  <path d="M0 324 C80 286 170 358 300 320" fill="none" stroke="#B08D4F" stroke-opacity=".38" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="0.1 8">
    <animate attributeName="stroke-dashoffset" values="0;-8.1" dur="14s" repeatCount="indefinite"/>
  </path>
  <path d="M0 344 C80 306 170 378 300 340" fill="none" stroke="#B08D4F" stroke-opacity=".2" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="0.1 8"/>

  <!-- rising gold motes -->
  <circle cx="62" cy="386" r="1.1" fill="#E3C379" fill-opacity="0">
    <animate attributeName="cy" values="386;322" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0;.75;0" keyTimes="0;.3;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="390" r="1.1" fill="#E3C379" fill-opacity="0">
    <animate attributeName="cy" values="390;330" dur="11s" begin="-4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0;.7;0" keyTimes="0;.3;1" dur="11s" begin="-4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="226" cy="384" r="1.1" fill="#E3C379" fill-opacity="0">
    <animate attributeName="cy" values="384;326" dur="10s" begin="-7s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0;.7;0" keyTimes="0;.3;1" dur="10s" begin="-7s" repeatCount="indefinite"/>
  </circle>

  <!-- small gold leaf (REA quill, abstracted) -->
  <g transform="translate(150,316) rotate(40) scale(.28)">
    <path d="M0 0 C-9 -9 -11 -24 0 -40 C11 -24 9 -9 0 0 Z" fill="#D9BC7A"/>
  </g>

  <!-- ══════════ imprint ══════════ -->
  <text class="c-cap"  x="150" y="350" fill="#D9BC7A" fill-opacity=".78">DATA &#183; MODELS &#183; DECISIONS</text>
  <text class="c-vol"  x="150" y="368" fill="#F0EBDB" fill-opacity=".88">VOL. 1 &#183; NO. 1 &#183; 2025</text>
  <text class="c-issn" x="150" y="379" fill="#F0EBDB" fill-opacity=".5">ISSN 0000-0000</text>
</svg>
